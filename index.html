<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>Redirect App</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>
<body>
<p>Mengarahkan ke aplikasi…</p>


<script>
const ua = navigator.userAgent || navigator.vendor || window.opera;


if (/android/i.test(ua)) {
window.location.href = "https://play.google.com/store/apps/details?id=id.loyal.abb&hl=en&pli=1";
} else if (/iPhone|iPad|iPod/i.test(ua)) {
window.location.href = "https://apps.apple.com/id/app/abb-star-reward/id6621200246";
} else {
window.location.href = "https://www.abb.com";
}
</script>
</body>
</html>
